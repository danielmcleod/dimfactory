<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden Snake</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f6ee;
        --ink: #1f2a1c;
        --muted: #4d5a49;
        --panel: #ffffff;
        --accent: #2f7d32;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.4 system-ui, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        padding: 16px;
      }
      header {
        display: flex;
        width: min(92vw, 480px);
        justify-content: space-between;
        align-items: baseline;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
      }
      #hud {
        margin: 0;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      canvas {
        width: min(92vw, 480px);
        height: min(92vw, 480px);
        border-radius: 12px;
        background: var(--panel);
        box-shadow: 0 4px 18px rgb(0 0 0 / 0.12);
        image-rendering: pixelated;
      }
      #message {
        margin: 0;
        min-height: 1.4em;
        color: var(--muted);
      }
      .touch {
        display: grid;
        grid-template-columns: repeat(3, 64px);
        gap: 8px;
      }
      .touch button {
        height: 56px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 1.4rem;
      }
      .touch .up {
        grid-column: 2;
      }
      .touch .left {
        grid-column: 1;
        grid-row: 2;
      }
      .touch .down {
        grid-column: 2;
        grid-row: 2;
      }
      .touch .right {
        grid-column: 3;
        grid-row: 2;
      }
      @media (hover: hover) and (pointer: fine) {
        .touch {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Garden Snake</h1>
        <p id="hud">Score 0 · Best 0</p>
      </header>
      <canvas id="board" width="480" height="480" aria-label="The garden where the snake moves"></canvas>
      <p id="message" role="status"></p>
      <div class="touch" aria-label="Touch controls">
        <button class="up" data-action="up" aria-label="Up">▲</button>
        <button class="left" data-action="left" aria-label="Left">◀</button>
        <button class="down" data-action="down" aria-label="Down">▼</button>
        <button class="right" data-action="right" aria-label="Right">▶</button>
      </div>
    </main>
    <script type="module">
      import { createLoop } from './src/engine/loop.js'
      import { createInput } from './src/engine/input.js'
      import { createRng } from './src/engine/rng.js'
      import { createStorage } from './src/engine/storage.js'
      import { installTestHook } from './src/engine/test-hook.js'

      const SIZE = 16
      const CELL = 30
      const STEP_TICKS = 8
      const canvas = document.getElementById('board')
      const ctx = canvas.getContext('2d')
      const hud = document.getElementById('hud')
      const message = document.getElementById('message')
      const saves = createStorage({ key: 'garden-snake', version: 1, defaults: { best: 0 } })
      const input = createInput()
      for (const b of document.querySelectorAll('.touch button')) input.attachTouchButton(b, b.dataset.action)
      // A tap (or click) on the garden is the action: it starts the game on a phone.
      input.attachTouchButton(canvas, 'action')
      let lastPointer = 'none'
      canvas.addEventListener('pointerdown', (e) => {
        lastPointer = e.pointerType
      })

      let rng = createRng(1)
      let best = saves.load().best
      let game

      function fresh() {
        const snake = [
          { x: 6, y: 8 },
          { x: 5, y: 8 },
          { x: 4, y: 8 },
        ]
        return { scene: 'title', score: 0, snake, dir: { x: 1, y: 0 }, next: { x: 1, y: 0 }, apple: placeApple(snake), wait: 0 }
      }

      function placeApple(snake) {
        for (;;) {
          const p = { x: rng.int(0, SIZE - 1), y: rng.int(0, SIZE - 1) }
          if (!snake.some((s) => s.x === p.x && s.y === p.y)) return p
        }
      }

      function steer(x, y) {
        if (game.dir.x === -x && game.dir.y === -y) return
        game.next = { x, y }
      }

      function update() {
        input.update()
        if (input.pressed('pause')) {
          if (game.scene === 'playing') loop.pause()
          else if (game.scene === 'paused') loop.resume()
        }
        if (input.pressed('action')) {
          if (game.scene === 'title') game.scene = 'playing'
          else if (game.scene === 'over') {
            game = fresh()
            game.scene = 'playing'
          }
        }
        if (game.scene !== 'playing') return
        if (input.isDown('up')) steer(0, -1)
        else if (input.isDown('down')) steer(0, 1)
        else if (input.isDown('left')) steer(-1, 0)
        else if (input.isDown('right')) steer(1, 0)
        game.wait++
        if (game.wait < STEP_TICKS) return
        game.wait = 0
        game.dir = game.next
        const head = { x: game.snake[0].x + game.dir.x, y: game.snake[0].y + game.dir.y }
        const out = head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE
        if (out || game.snake.some((s) => s.x === head.x && s.y === head.y)) {
          game.scene = 'over'
          if (game.score > best) {
            best = game.score
            saves.save({ best })
          }
          return
        }
        game.snake.unshift(head)
        if (head.x === game.apple.x && head.y === game.apple.y) {
          game.score += 10
          game.apple = placeApple(game.snake)
        } else game.snake.pop()
      }

      function render() {
        for (let y = 0; y < SIZE; y++)
          for (let x = 0; x < SIZE; x++) {
            ctx.fillStyle = (x + y) % 2 === 0 ? '#cfe6b8' : '#c2dda8'
            ctx.fillRect(x * CELL, y * CELL, CELL, CELL)
          }
        ctx.fillStyle = '#c62828'
        ctx.beginPath()
        ctx.arc(game.apple.x * CELL + CELL / 2, game.apple.y * CELL + CELL / 2, CELL * 0.38, 0, Math.PI * 2)
        ctx.fill()
        ctx.fillStyle = '#5d4037'
        ctx.fillRect(game.apple.x * CELL + CELL / 2 - 1, game.apple.y * CELL + 3, 3, 7)
        game.snake.forEach((s, i) => {
          ctx.fillStyle = i === 0 ? '#1b5e20' : '#2e7d32'
          ctx.beginPath()
          ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 8)
          ctx.fill()
        })
        const words = {
          title: 'Press Space to start. Arrow keys steer. P or Esc pauses.',
          playing: 'Eat the apples. Do not hit the walls or yourself.',
          paused: 'Paused. Press P or Esc to carry on.',
          over: `Game over: ${game.score} points. Press Space to play again.`,
        }
        if (game.scene !== 'playing') {
          ctx.fillStyle = 'rgb(255 255 255 / 0.82)'
          ctx.fillRect(0, CELL * 6, SIZE * CELL, CELL * 4)
          ctx.fillStyle = '#1f2a1c'
          ctx.font = 'bold 28px system-ui, sans-serif'
          ctx.textAlign = 'center'
          const big = { title: 'Garden Snake', paused: 'Paused', over: 'Game over' }[game.scene]
          ctx.fillText(big, (SIZE * CELL) / 2, CELL * 8.3)
        }
        hud.textContent = `Score ${game.score} · Best ${best}`
        message.textContent = words[game.scene]
      }

      game = fresh()
      const loop = createLoop({
        update,
        render,
        onPause: () => {
          if (game.scene === 'playing') game.scene = 'paused'
        },
        onResume: () => {
          if (game.scene === 'paused') game.scene = 'playing'
        },
      })
      // A paused loop runs no update, so the keys that carry on are read here (and the press is not seen twice).
      addEventListener('keydown', (e) => {
        if (!loop.paused || !['KeyP', 'Escape', 'Space'].includes(e.code)) return
        input.update()
        loop.resume()
      })
      installTestHook({
        loop,
        input,
        rng,
        state: () => ({
          scene: game.scene,
          score: game.score,
          lives: 1,
          level: 1,
          length: game.snake.length,
          head: { ...game.snake[0] },
          dir: { ...game.dir },
          pointer: lastPointer,
          touch: navigator.maxTouchPoints > 0,
        }),
        setSeed: (n) => {
          rng = createRng(n)
          game = fresh()
        },
      })
      loop.start()
    </script>
  </body>
</html>
